# delap: d94-mcp (Local UMD routes.yml 의 /mcp → http://d94-mcp:8095) + token-sync (1시간 주기)
services:
  d94-mcp:
    image: ghcr.io/david-yj-52/d94-mcp:${IMAGE_TAG:-latest}
    container_name: d94-mcp
    restart: unless-stopped
    environment:
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway-cloud-gateway-1:10001}
    networks: [cloud]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  token-sync:
    image: ghcr.io/david-yj-52/d94-mcp:${IMAGE_TAG:-latest}
    container_name: d94-token-sync
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "d94_mcp.token_sync", "--loop", "3600"]
    # PostgreSQL(tsh-postgres)이 붙은 네트워크. AP-02 Redis 는 외부 주소라 별도 네트워크 불필요
    networks: [db]

networks:
  cloud:
    name: ${CLOUD_NETWORK_NAME:-befw-cloud-network}
    external: true
  db:
    name: ${DB_NETWORK_NAME:-tsh-network}
    external: true
